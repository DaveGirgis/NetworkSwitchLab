site_name: Network Training Labs
site_description: CCNA Lab Series — Cisco 3725 in GNS3
site_author: Network Training Lab
site_url: https://DaveGirgis.github.io/NetworkSwitchLab/

repo_name: DaveGirgis/NetworkSwitchLab
repo_url: https://github.com/DaveGirgis/NetworkSwitchLab
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list

nav:
  - Home: index.md

  - Session 1 — Simulation Platform Introduction:
    - Overview: session1/index.md
    - Topology: session1/topology.md
    - Platform Setup: session1/addressing.md
    - Tasks:
      - Part 0 — Installation & Architecture: session1/tasks/part0.md
      - Part 1 — Adding Devices: session1/tasks/part1.md
      - Part 2 — Connecting Devices: session1/tasks/part2.md
      - Part 3 — Console Access: session1/tasks/part3.md
      - Verification: session1/tasks/verify.md
    - Reference:
