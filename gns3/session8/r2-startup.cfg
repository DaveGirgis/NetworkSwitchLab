!
! R2 -- Hub Router
!
! FAULT 2: network statement for 10.1.23.0/30 is intentionally missing from
!          router ospf 1 -- R2 and R3 will not form an OSPF adjacency.
!
! FAULT 3: ACL CROSS-SITE permits traffic destined for VLAN 30 (172.16.30.0/24)
!          but is missing the permit for VLAN 40 (172.16.40.0/24).
!
version 12.4
!
hostname R2
enable secret cisco
!
no ip domain-lookup
!
! --- WAN interfaces ---
interface FastEthernet0/0
 ip address 10.1.12.2 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface FastEthernet0/1
 ip address 10.1.23.1 255.255.255.252
 duplex auto
 speed auto
 ip access-group CROSS-SITE out
 no shutdown
!
! --- ACL -- FAULT 3: permit for 172.16.40.0/24 destination is missing ---
ip access-list extended CROSS-SITE
 permit ip 172.16.0.0 0.0.255.255 172.16.30.0 0.0.0.255
!
! --- OSPF -- FAULT 2: network 10.1.23.0 0.0.0.3 area 0 is missing ---
router ospf 1
 network 10.1.12.0 0.0.0.3 area 0
!
! --- VTY access ---
line vty 0 4
 password cisco
 login
 transport input telnet
!
end
