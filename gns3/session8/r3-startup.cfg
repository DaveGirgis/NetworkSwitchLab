!
! R3 -- Right Site
!
! FAULT 1: Fa1/40 (PC-E port) is assigned to VLAN 1 instead of VLAN 40.
!          VLAN 40 and its SVI are configured correctly -- the port assignment
!          is the only error. Vlan40 SVI will remain down/down as a result.
!
version 12.4
!
hostname R3
enable secret cisco
!
no ip domain-lookup
!
! --- WAN interface toward R2 ---
interface FastEthernet0/0
 ip address 10.1.23.2 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface FastEthernet0/1
 no ip address
 shutdown
!
! --- NM-16ESW access ports ---
interface FastEthernet1/30
 switchport mode access
 switchport access vlan 30
 no shutdown
!
! FAULT 1: this port should be "switchport access vlan 40"
interface FastEthernet1/40
 switchport mode access
 switchport access vlan 1
 no shutdown
!
! --- SVIs ---
interface Vlan1
 no ip address
 shutdown
!
interface Vlan30
 ip address 172.16.30.1 255.255.255.0
 no shutdown
!
interface Vlan40
 ip address 172.16.40.1 255.255.255.0
 no shutdown
!
! --- OSPF ---
router ospf 1
 network 10.1.23.0 0.0.0.3 area 0
 network 172.16.30.0 0.0.0.255 area 0
 network 172.16.40.0 0.0.0.255 area 0
!
! --- VTY access ---
line vty 0 4
 password cisco
 login
 transport input telnet
!
end
